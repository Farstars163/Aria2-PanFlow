<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Baidu x Aria2 下载管理器</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
    <script src="https://unpkg.com/element-plus"></script>
</head>
<body>
<div id="app" style="padding: 20px;">
    <el-card>
        <template #header>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span>百度网盘目录</span>
                <div>
                    <el-button type="primary" @click="handleOAuth" v-if="!accessToken">授权登录网盘</el-button>
                    <el-button type="info" @click="showTokenInput = true" v-if="!accessToken">手动输入 Token</el-button>
                    <el-tag type="success" v-else closable @close="logout">已授权 (Token: {{ accessToken.substring(0,8) }}...)</el-tag>
                </div>
            </div>
        </template>

        <el-tree v-if="accessToken" :props="treeProps" :load="loadNode" lazy show-checkbox ref="treeRef" node-key="fs_id">
            <template #default="{ node, data }">
                <span>
                    <i :class="data.isdir ? 'el-icon-folder' : 'el-icon-document'"></i>
                    {{ node.label }}
                </span>
            </template>
        </el-tree>

        <div style="margin-top: 20px;" v-if="accessToken">
            <el-button type="success" @click="sendToAria2">推送勾选文件到 Aria2</el-button>
        </div>
    </el-card>

    <el-dialog v-model="showTokenInput" title="授权确认" width="500px">
        <p>1. 请在打开的百度页面完成授权。</p>
        <p>2. 授权成功后，复制地址栏中 <b>access_token=</b> 后面的一串字符。</p>
        <el-input v-model="tempToken" placeholder="在此粘贴 access_token" clearable style="margin-top: 15px;"></el-input>
        <template #footer>
            <el-button @click="showTokenInput = false">取消</el-button>
            <el-button type="primary" @click="saveToken">保存并初始化</el-button>
        </template>
    </el-dialog>
</div>

<script>
    const { createApp, ref, onMounted } = Vue;

    createApp({
        setup() {
            const accessToken = ref(localStorage.getItem('baidu_token') || '');
            const showTokenInput = ref(false);
            const tempToken = ref('');
            const treeRef = ref(null);
            const treeProps = { label: 'server_filename', children: 'zones', isLeaf: (data) => data.isdir === 0 };

            const clientIds = [
                "L6g70tBRRIXLsY0Z3HwKqlRE", "NqOMXF6XGhGRIGemsQ9nG0Na", "fSds3K4w43rw37tOqlQmTa2kDwaczK4U",
                "TFwtw8uwHxpdkvVqVKdIlx1XqXUnr1zG", "9dgBV9yesuBVOXaxls7aVHbLBLqU8yyg", "l9DdBOG4RYroMscmzK5OChdaGelgd92M",
                "Kyr013gHQBf2immy3fQt1jZ3nZVpiGAm", "iYCeC9g08h5vuP9UqvPHKKSVrKFXGa1v", "omiOnr2tYnN9vSyDErcVFWpPU2mZA7YO",
                "QHOuRXiepJBMjtk0esLhrPoNlQyYd0mF", "IlLqBbU3GjQ0t46TRwFateTprHWl39zF"
            ];

            // 授权跳转
            const handleOAuth = () => {
                const randomClientId = clientIds[Math.floor(Math.random() * clientIds.length)];
                // 使用 oob 解决 referer_mismatch 问题
                const authUrl = `https://openapi.baidu.com/oauth/2.0/authorize?response_type=token&scope=basic,netdisk&client_id=${randomClientId}&redirect_uri=oob`;
                const a = document.createElement('a');
                a.href = authUrl;
                a.target = '_blank';
                a.rel = 'noreferrer';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                showTokenInput.value = true;
            };
            // 保存 Token
            const saveToken = () => {
                if (tempToken.value.length < 10) {
                    ElementPlus.ElMessage.error("请输入有效的 Token");
                    return;
                }
                accessToken.value = tempToken.value;
                localStorage.setItem('baidu_token', tempToken.value);
                showTokenInput.value = false;
                tempToken.value = '';
                ElementPlus.ElMessage.success("授权成功！");
                location.reload(); // 重新加载以触发 tree 刷新
            };

            const logout = () => {
                localStorage.removeItem('baidu_token');
                accessToken.value = '';
                location.reload();
            };

            const loadNode = async (node, resolve) => {
                const dir = node.level === 0 ? '/' : node.data.path;
                try {
                    // 调用你写好的 Servlet 接口
                    const res = await fetch(`/api/baidu?action=list&dir=${encodeURIComponent(dir)}&token=${accessToken.value}`);
                    const json = await res.json();
                    if (json.errno === 0) {
                        resolve(json.list || []);
                    } else {
                        ElementPlus.ElMessage.warning("获取列表失败: " + (json.errmsg || json.errno));
                        resolve([]);
                    }
                } catch (e) {
                    resolve([]);
                }
            };

            const sendToAria2 = async () => {
                    const checkedNodes = treeRef.value.getCheckedNodes();
                    const files = checkedNodes.filter(node => node.isdir === 0);
                    if (files.length === 0) return ElementPlus.ElMessage.error("未勾选文件");

                    const selectedFiles = files.map(file =>({
                        fs_id :file.fs_id,
                        filename : file.server_filename
                    }));
                sessionStorage.setItem('pendingDownloads', JSON.stringify(selectedFiles));
                sessionStorage.setItem('baidu_token', accessToken.value);
                window.location.href ="index.html";
            };

            return { accessToken, treeRef, treeProps, showTokenInput, tempToken, handleOAuth, saveToken, logout, loadNode, sendToAria2 };
        }
    }).use(ElementPlus).mount('#app');

</script>
</body>
</html>
