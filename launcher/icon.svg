<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- PanDownloader 图标: 深蓝圆底 + 白色下载箭头入托盘 + 速度感双翼 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b6cb0"/>
      <stop offset="1" stop-color="#1a365d"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bee3f8"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- 速度双翼 -->
  <rect x="22" y="40" width="18" height="6" rx="3" fill="#63b3ed" opacity="0.85"/>
  <rect x="16" y="54" width="24" height="6" rx="3" fill="#63b3ed" opacity="0.6"/>
  <rect x="22" y="68" width="18" height="6" rx="3" fill="#63b3ed" opacity="0.35"/>
  <!-- 下载箭头 -->
  <path d="M76 26 L76 62 L92 62 L66 90 L40 62 L56 62 L56 26 Z" fill="url(#arrow)"/>
  <!-- 底部托盘 -->
  <rect x="34" y="94" width="64" height="10" rx="5" fill="#ffffff"/>
</svg>
