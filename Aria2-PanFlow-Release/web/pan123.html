<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>123云盘个人私有控制台</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
    <script src="https://unpkg.com/element-plus"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <style>
        body { margin: 0; padding: 20px; background-color: #f5f7fa; font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "微软雅黑", Arial, sans-serif; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 12px 0 rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .folder-link { color: #409EFF; cursor: pointer; text-decoration: none; }
        .folder-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div id="app">
    <div class="container">
        <div class="header">
            <h2>☁️ 123云盘目录</h2>
            <el-button type="primary" plain @click="goBack" :disabled="pathStack.length === 1">
                返回上级目录
            </el-button>
        </div>

        <el-table :data="fileList" v-loading="loading" style="width: 100%" @row-dblclick="handleRowDblclick">
            <el-table-column label="图标" width="80" align="center">
                <template #default="scope">
                        <span style="font-size: 20px;">
                            {{ (scope.row.type !== undefined ? scope.row.type : scope.row.Type) === 1 ? '📁' : '📄' }}
                        </span>
                </template>
            </el-table-column>

            <el-table-column label="文件名" min-width="300">
                <template #default="scope">
                        <span :class="{'folder-link': (scope.row.type !== undefined ? scope.row.type : scope.row.Type) === 1}">
                            {{ scope.row.fileName || scope.row.FileName }}
                        </span>
                </template>
            </el-table-column>

            <el-table-column label="大小" width="120">
                <template #default="scope">
                    {{ formatSize(scope.row.size !== undefined ? scope.row.size : scope.row.Size) }}
                </template>
            </el-table-column>

            <el-table-column label="操作" width="150" align="center">
                <template #default="scope">
                    <el-button
                            v-if="(scope.row.type !== undefined ? scope.row.type : scope.row.Type) === 0"
                            type="success" size="small"
                            @click="getDownloadLink(scope.row)"
                            :loading="downloadingId === (scope.row.fileId || scope.row.FileId)">
                        获取直链
                    </el-button>
                </template>
            </el-table-column>
        </el-table>
    </div>
</div>

<script>
    const { createApp, ref, onMounted } = Vue;
    const { ElMessage, ElMessageBox } = ElementPlus;

    const API_BASE = "http://127.0.0.1:5001/api";

    createApp({
        setup() {
            const fileList = ref([]);
            const loading = ref(false);
            const downloadingId = ref(null);

            // 记录目录层级的栈，默认压入根目录 0
            const pathStack = ref([0]);

            // 获取当前目录 ID
            const currentParentId = () => pathStack.value[pathStack.value.length - 1];

            const fetchFiles = async () => {
                loading.value = true;
                try {
                    const res = await axios.get(`${API_BASE}/list`, { params: { parent_id: currentParentId() } });
                    if (res.data.code === 0) {
                        fileList.value = res.data.data;
                    } else {
                        ElMessage.error(res.data.message || "获取列表失败");
                    }
                } catch (error) {
                    ElMessage.error("网络请求失败，请检查后端服务是否开启");
                } finally {
                    loading.value = false;
                }
            };

            const goBack = () => {
                if (pathStack.value.length > 1) {
                    pathStack.value.pop();
                    fetchFiles();
                }
            };

            const handleRowDblclick = (row) => {
                const f_type = row.type !== undefined ? row.type : row.Type;
                const f_id = row.fileId || row.FileId;
                // 如果是文件夹，压入栈并刷新
                if (f_type === 1) {
                    pathStack.value.push(f_id);
                    fetchFiles();
                }
            };

            const getDownloadLink = async (row) => {
                sessionStorage.setItem('pendingDownloads', JSON.stringify([row]));
                sessionStorage.setItem('pan123_ready', 'true');
                window.location.href ="./index.html";
            };
            const formatSize = (size) => {
                if (size === 0 || !size) return '-';
                const i = Math.floor(Math.log(size) / Math.log(1024));
                return (size / Math.pow(1024, i)).toFixed(2) * 1 + ' ' + ['B', 'KB', 'MB', 'GB', 'TB'][i];
            };

            onMounted(() => {
                fetchFiles();
            });

            return { fileList, loading, pathStack, downloadingId, fetchFiles, goBack, handleRowDblclick, getDownloadLink, formatSize };
        }
    }).use(ElementPlus).mount('#app');
</script>
</body>
</html>
