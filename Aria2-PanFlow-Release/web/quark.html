<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Quark x Aria2 下载管理器</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
    <script src="https://unpkg.com/element-plus"></script>
</head>
<body>
<div id="app" style="padding: 20px;">
    <el-card>
        <template #header>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span>夸克网盘目录</span>
                <div>
                    <el-button type="primary" @click="showCookieInput = true" v-if="!quarkCookie">填写夸克 Cookie</el-button>
                    <el-tag type="success" v-else closable @close="logout">已绑定 Cookie (点击右侧 x 清除)</el-tag>
                </div>
            </div>
        </template>

        <el-tree v-if="quarkCookie" :props="treeProps" :load="loadNode" lazy show-checkbox ref="treeRef" node-key="fid">
            <template #default="{ node, data }">
                <span>
                    <i :class="data.file === false ? 'el-icon-folder' : 'el-icon-document'"></i>
                    {{ node.label }}
                </span>
            </template>
        </el-tree>

        <div style="margin-top: 20px;" v-if="quarkCookie">
            <el-button type="success" @click="sendToAria2">推送勾选文件到 Aria2</el-button>
        </div>
    </el-card>

    <el-dialog v-model="showCookieInput" title="配置夸克身份凭证" width="550px">
        <p>1. 请在浏览器中登录<a href="https://pan.quark.cn/" target="_blank" title="该链接为官方网站，您的信息不会被泄露">https://pan.quark.cn/</a></p>
        <p>2. 按 F12 打开开发者工具，<sup>(若打不开可尝试启用热键后重试)</sup>，切换到网络/network,点击任意请求并复制 <b>Cookie:</b> 后面的全量字符串。</p>
        <el-input type="textarea" :rows="4" v-model="tempCookie" placeholder="在此粘贴完整的 Cookie..." style="margin-top: 15px;"></el-input>
        <template #footer>
            <el-button @click="showCookieInput = false">取消</el-button>
            <el-button type="primary" @click="saveCookie">保存并加载</el-button>
        </template>
    </el-dialog>
</div>

<script>
    const { createApp, ref, onMounted } = Vue;

    createApp({
        setup() {
            const quarkCookie = ref(localStorage.getItem('quark_cookie') || '');
            const showCookieInput = ref(false);
            const tempCookie = ref('');
            const treeRef = ref(null);

            // 夸克的 API 返回结构中：文件名是 file_name，是否为文件夹通过 file: false 判断
            const treeProps = { label: 'file_name', children: 'zones', isLeaf: (data) => data.file === true };

            const saveCookie = () => {
                if (tempCookie.value.length < 20) {
                    ElementPlus.ElMessage.error("Cookie 长度异常，请确保复制完整！");
                    return;
                }
                quarkCookie.value = tempCookie.value;
                localStorage.setItem('quark_cookie', tempCookie.value);
                showCookieInput.value = false;
                tempCookie.value = '';
                ElementPlus.ElMessage.success("Cookie 配置成功！");
                location.reload();
            };

            const logout = () => {
                localStorage.removeItem('quark_cookie');
                quarkCookie.value = '';
                location.reload();
            };

            const loadNode = async (node, resolve) => {
                const dir = node.level === 0 ? '0' : node.data.fid;
                try {
                    const res = await fetch(`/api/quark?action=list&dir=${encodeURIComponent(dir)}&cookie=${encodeURIComponent(quarkCookie.value)}`);

                    // 【防御性编程】：先作为文本读取，确认是 JSON 再解析
                    const text = await res.text();
                    let json;
                    try {
                        json = JSON.parse(text);
                    } catch (err) {
                        console.error("服务器返回了非 JSON 内容:", text);
                        ElementPlus.ElMessage.error("被夸克风控拦截，请重新抓取最新 Cookie！");
                        resolve([]);
                        return;
                    }

                    if (json.code === 0 && json.data && json.data.list) {
                        resolve(json.data.list);
                    } else if (json.code === 31001 || res.status === 401) {
                        ElementPlus.ElMessage.error("Cookie 已过期或被拦截，请重新配置！");
                        logout();
                        resolve([]);
                    } else {
                        resolve([]);
                    }
                } catch (e) {
                    console.error("加载目录失败:", e);
                    resolve([]);
                }
            };

            const sendToAria2 = async () => {
                const checkedNodes = treeRef.value.getCheckedNodes();
                // 过滤出文件 (夸克数据结构中 file: true 代表是文件)
                const files = checkedNodes.filter(node => node.file === true);
                if (files.length === 0) return ElementPlus.ElMessage.error("未勾选文件或不支持直接推送文件夹");

                const selectedFiles = files.map(f =>({
                    fs_id: f.fid,
                    filename: f.file_name
                }));

                sessionStorage.setItem('pendingDownloads', JSON.stringify(selectedFiles));
                sessionStorage.setItem('quark_cookie', quarkCookie.value);
                window.location.href ="index.html";
            };

            return { quarkCookie, treeRef, treeProps, showCookieInput, tempCookie, saveCookie, logout, loadNode, sendToAria2 };
        }
    }).use(ElementPlus).mount('#app');
</script>
</body>
</html>
