name: macOS 兼容性测试

# 触发方式：
#   - 手动触发（Actions 页面 → Run workflow）
#   - push 到 dist-versions-copy 下 Mac 目录时自动触发
on:
  workflow_dispatch:
  push:
    paths:
      - 'dist-versions-copy/Aria2-PanFlow-Mac*/**'

jobs:
  test:
    name: 测试 ${{ matrix.project }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Arm 项目 → macOS arm64 runner（M1，标准 runner）
          - project: Aria2-PanFlow-MacArm-Full
            runs_on: macos-14
            arch: arm64
          - project: Aria2-PanFlow-MacArm-Quark
            runs_on: macos-14
            arch: arm64
          # X64 项目 → macOS Intel x64 runner
          - project: Aria2-PanFlow-MacX64-Full
            runs_on: macos-15-intel
            arch: x64
          - project: Aria2-PanFlow-MacX64-Quark
            runs_on: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runs_on }}
    defaults:
      run:
        working-directory: dist-versions-copy/${{ matrix.project }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 1. 环境与文件结构检查
        run: |
          echo "=== Runner 架构: $(uname -m) ==="
          echo "=== macOS 版本 ==="
          sw_vers
          echo "=== 项目结构 ==="
          ls -la
          echo "=== 关键文件存在性 ==="
          for f in start.command stop.command app/Aria2-PanFlow.jar; do
            [ -f "$f" ] && echo "[OK] $f" || echo "[缺失] $f"
          done

      - name: 2. 脚本语法检查
        run: |
          echo "=== start.command 语法 ==="
          bash -n start.command && echo "[OK] start.command 语法正确" || echo "[失败] start.command 语法错误"
          echo "=== stop.command 语法 ==="
          bash -n stop.command && echo "[OK] stop.command 语法正确" || echo "[失败] stop.command 语法错误"
          echo "=== 执行权限 ==="
          chmod +x start.command stop.command aria2/*/aria2c
          ls -l start.command stop.command

      - name: 3. 二进制冒烟测试（保留完整输出，定位崩溃原因）
        run: |
          echo "=== 内置 aria2c 直接运行测试 ==="
          ARIA2_BIN=$(ls aria2/*/aria2c 2>/dev/null | head -1)
          echo "aria2c 路径: $ARIA2_BIN"
          file "$ARIA2_BIN"
          echo "--- 运行 aria2c --version（无代理干扰） ---"
          env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u http_proxy -u https_proxy -u all_proxy "$ARIA2_BIN" --version 2>&1 | head -6
          echo "aria2c --version 退出码: $?"
          echo ""
          echo "=== 内置 JDK 直接运行测试 ==="
          JAVA_BIN=$(ls jre/*/Contents/Home/bin/java 2>/dev/null | head -1)
          echo "java 路径: $JAVA_BIN"
          file "$JAVA_BIN"
          echo "--- 运行 java -version ---"
          "$JAVA_BIN" -version 2>&1 | head -4
          echo "java -version 退出码: $?"

      - name: 4. 完整启动测试（后台运行 + 端口轮询 + API 验证）
        run: |
          RUNNER_ARCH=$(uname -m)
          echo "=== Runner 实际架构: $RUNNER_ARCH ==="
          echo "=== 项目预期架构: ${{ matrix.arch }} ==="

          echo "=== 启动 start.command（后台，清除 GitHub Actions 代理变量防 aria2c 崩溃） ==="
          env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u http_proxy -u https_proxy -u all_proxy nohup bash start.command > /tmp/start.log 2>&1 &
          sleep 8
          echo "=== 8 秒后启动日志 ==="
          cat /tmp/start.log

          # 轮询后端端口 18080（最多 90 秒）
          echo "=== 等待后端端口 18080 就绪 ==="
          READY=0
          for i in $(seq 1 90); do
            if nc -z 127.0.0.1 18080 2>/dev/null; then
              echo "[OK] 后端端口 18080 已就绪（${i} 秒）"
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            echo "[失败] 18080 端口未在 90 秒内就绪"
            echo "=== 完整启动日志（诊断） ==="
            cat /tmp/start.log
            echo "=== 相关进程状态 ==="
            ps aux | grep -E "aria2c|Aria2-PanFlow" | grep -v grep || echo "无 aria2c/后端进程"
            echo "=== 监听端口 ==="
            lsof -iTCP -sTCP:LISTEN -P 2>/dev/null | grep -E "18080|16800" || echo "18080/16800 均未监听"
            exit 1
          fi

          # 验证 aria2 RPC 端口 16800
          echo "=== 检查 aria2 RPC 端口 16800 ==="
          if nc -z 127.0.0.1 16800 2>/dev/null; then
            echo "[OK] aria2 RPC 16800 监听中"
            curl -s -m 5 -X POST http://127.0.0.1:16800/jsonrpc \
              -H 'Content-Type: application/json' \
              -d '{"jsonrpc":"2.0","id":"1","method":"aria2.getVersion","params":["token:123456"]}' \
              | head -c 300
            echo ""
          else
            echo "[警告] aria2 RPC 16800 未监听（不影响后端测试，记录即可）"
          fi

          # 验证后端 API
          echo "=== 验证后端 HTTP ==="
          curl -s -o /dev/null -w "首页 HTTP 状态: %{http_code}\n" -m 5 http://127.0.0.1:18080/ || echo "[失败] 首页无响应"
          echo "=== 生命周期状态 API ==="
          curl -s -m 5 http://127.0.0.1:18080/api/lifecycle/status || echo "[警告] 状态 API 无响应"
          echo ""
          echo "=== 测试结论：项目在 $(uname -m) macOS 上启动成功 ==="

      - name: 5. 清理进程
        if: always()
        run: |
          echo "=== 执行 stop.command 清理 ==="
          bash stop.command || true
          echo "=== 兜底清理 ==="
          pkill -f "Aria2-PanFlow.jar" 2>/dev/null || true
          pkill aria2c 2>/dev/null || true
          pkill -f "start.command" 2>/dev/null || true
          echo "[OK] 清理完成"
