name: aria2 patched 版验证与产物导出

# 目的：用 homebrew-aria2-patched（解除 max-connection-per-server 16 限制的补丁版）
#   编译支持 64 连接的 aria2c → 替换分发版内置二进制 → 验证 16800 监听 → 导出产物
# 用法：Actions 页面手动触发；产物在 job 的 Artifacts 区下载
on:
  workflow_dispatch:

jobs:
  patched-build:
    name: patched aria2 编译验证 ${{ matrix.project }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Aria2-PanFlow-MacArm-Full
            runs_on: macos-14
            arch: arm64
            artifact: aria2c-arm64
          - project: Aria2-PanFlow-MacX64-Full
            runs_on: macos-15-intel
            arch: x64
            artifact: aria2c-x64
    runs-on: ${{ matrix.runs_on }}
    defaults:
      run:
        working-directory: dist-versions-copy/${{ matrix.project }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 1. 编译安装 patched aria2（解除 16 连接限制）
        run: |
          echo "=== brew tap + build-from-source（耗时 5-15 分钟） ==="
          brew tap kobakazu0429/aria2-patched 2>&1 | tail -2
          brew install --build-from-source kobakazu0429/aria2-patched/aria2-patched 2>&1 | tail -8
          echo "=== 编译结果 ==="
          which aria2c
          aria2c --version 2>&1 | head -4
          echo "aria2c 退出码: ${PIPESTATUS[0]}"

      - name: 2. 验证 patched aria2c 支持 max-connection-per-server=64
        run: |
          BREW_ARIA2=$(which aria2c)
          echo "aria2c: $BREW_ARIA2"
          echo "=== 用 conf 设 max-connection-per-server=64 前台启动 8 秒 ==="
          CONF=$(ls aria2/*/aria2.conf | head -1)
          ARIA2_DIR=$(dirname "$CONF")
          echo "conf: $CONF"
          # 临时 conf：把连接数设为 64 验证补丁生效
          sed 's/max-connection-per-server.*/max-connection-per-server = 64/' "$CONF" > /tmp/aria2-test.conf
          (cd "$ARIA2_DIR" && env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u http_proxy -u https_proxy -u all_proxy -u DYLD_INSERT_LIBRARIES "$BREW_ARIA2" --conf-path=/tmp/aria2-test.conf > /tmp/aria2.log 2>&1 &)
          sleep 8
          echo "--- aria2 进程状态 ---"
          ps aux | grep aria2c | grep -v grep || echo "aria2c 进程已退出"
          echo "--- aria2 日志 ---"
          cat /tmp/aria2.log | head -12
          echo "--- 关键验证：16800 监听 + 64 连接是否被接受 ---"
          if nc -z 127.0.0.1 16800 2>/dev/null; then
            echo "[OK] patched aria2c RPC 16800 监听中（max-connection-per-server=64 已生效）"
            curl -s -m 5 -X POST http://127.0.0.1:16800/jsonrpc \
              -H 'Content-Type: application/json' \
              -d '{"jsonrpc":"2.0","id":"1","method":"aria2.getVersion","params":["token:123456"]}' \
              | head -c 300
            echo ""
          else
            echo "[结果] 16800 未监听"
            echo "--- 若日志有 Parse error，说明补丁未生效 ---"
            grep -i "parse error\|must be between" /tmp/aria2.log || echo "无解析错误"
          fi
          pkill aria2c 2>/dev/null || true

      - name: 3. 用 patched aria2c 替换分发版内置二进制并完整测试
        run: |
          BREW_ARIA2=$(which aria2c)
          INNER_ARIA2=$(ls aria2/*/aria2c | head -1)
          echo "=== 替换内置 aria2c ==="
          cp "$BREW_ARIA2" "$INNER_ARIA2"
          chmod +x "$INNER_ARIA2"
          echo "已替换: $INNER_ARIA2 ($(file "$INNER_ARIA2" | cut -d: -f2))"
          echo "=== 设置 conf max-connection-per-server=64 ==="
          CONF=$(ls aria2/*/aria2.conf | head -1)
          sed -i 's/max-connection-per-server.*/max-connection-per-server = 64/' "$CONF"
          grep -n "max-connection-per-server" "$CONF"
          echo "=== 完整 start.command 测试（清代理） ==="
          env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u http_proxy -u https_proxy -u all_proxy -u DYLD_INSERT_LIBRARIES nohup bash start.command > /tmp/start.log 2>&1 &
          sleep 10
          echo "--- 10 秒后日志 ---"
          cat /tmp/start.log
          echo "--- 端口检查 ---"
          nc -z 127.0.0.1 18080 2>/dev/null && echo "[OK] 18080 监听" || echo "[!] 18080 未监听"
          nc -z 127.0.0.1 16800 2>/dev/null && echo "[OK] 16800 监听（aria2 正常！）" || echo "[!] 16800 未监听"
          echo "--- 后端 API ---"
          curl -s -m 5 http://127.0.0.1:18080/api/lifecycle/status || echo "API 无响应"

      - name: 4. 导出 patched aria2c 产物（供本地重新打包）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-versions-copy/${{ matrix.project }}/aria2/*/aria2c
          if-no-files-found: error

      - name: 5. 清理
        if: always()
        run: |
          bash stop.command || true
          pkill -f "Aria2-PanFlow.jar" 2>/dev/null || true
          pkill aria2c 2>/dev/null || true
          echo "[OK] 清理完成"
