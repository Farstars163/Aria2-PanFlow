name: aria2 brew 版替换验证

# 目的：验证内置 aria2c 崩溃是否因二进制版本问题
#   直接前台分别测试 brew 版 aria2c 和 Java 后端，不依赖 start.command 复杂流程
on:
  workflow_dispatch:

jobs:
  brew-test:
    name: brew aria2 替换测试 ${{ matrix.project }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Aria2-PanFlow-MacArm-Full
            runs_on: macos-14
            arch: arm64
          - project: Aria2-PanFlow-MacX64-Full
            runs_on: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runs_on }}
    defaults:
      run:
        working-directory: dist-versions-copy/${{ matrix.project }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 1. 安装 Homebrew 版 aria2
        run: |
          echo "=== brew 路径 ==="
          which brew || echo "brew 不存在"
          echo "=== 安装 aria2（可能需 1-3 分钟） ==="
          brew install aria2 2>&1 | tail -4
          echo "=== brew aria2c 路径与版本 ==="
          which aria2c
          aria2c --version 2>&1 | head -3
          echo "brew aria2c 退出码: ${PIPESTATUS[0]}"

      - name: 2. 直接前台测试 brew 版 aria2c（带分发版 conf，验证 16800）
        run: |
          echo "=== 用 brew 版 aria2c + 分发版 aria2.conf 前台启动 8 秒 ==="
          BREW_ARIA2=$(which aria2c)
          echo "brew aria2c: $BREW_ARIA2"
          CONF=$(ls aria2/*/aria2.conf | head -1)
          echo "aria2.conf: $CONF"
          ARIA2_DIR=$(dirname "$CONF")
          echo "aria2 目录: $ARIA2_DIR"
          echo "--- 启动（前台，8 秒后检查） ---"
          (cd "$ARIA2_DIR" && env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u http_proxy -u https_proxy -u all_proxy -u DYLD_INSERT_LIBRARIES "$BREW_ARIA2" --conf-path=aria2.conf > /tmp/aria2.log 2>&1 &)
          sleep 8
          echo "--- aria2 进程状态 ---"
          ps aux | grep aria2c | grep -v grep || echo "aria2c 进程已退出"
          echo "--- aria2 日志 ---"
          cat /tmp/aria2.log | head -15
          echo "--- 关键验证：16800 是否监听 ---"
          if nc -z 127.0.0.1 16800 2>/dev/null; then
            echo "[OK] brew 版 aria2c RPC 16800 监听中"
            curl -s -m 5 -X POST http://127.0.0.1:16800/jsonrpc \
              -H 'Content-Type: application/json' \
              -d '{"jsonrpc":"2.0","id":"1","method":"aria2.getVersion","params":["token:123456"]}' \
              | head -c 300
            echo ""
            echo "=== 判定：brew 版 aria2c 正常，内置二进制需替换 ==="
          else
            echo "[结果] brew 版 aria2c 也未监听 16800"
            echo "--- 若进程已退出，可能是 runner 沙箱限制；若进程存活但端口未监听，看日志 ---"
          fi
          pkill aria2c 2>/dev/null || true

      - name: 3. 直接前台测试内置 JDK + Java 后端（验证 18080）
        run: |
          echo "=== 用内置 JDK 前台启动后端 20 秒 ==="
          JAVA_BIN=$(ls jre/*/Contents/Home/bin/java | head -1)
          echo "java: $JAVA_BIN"
          "$JAVA_BIN" -version 2>&1 | head -3
          echo "--- 启动后端（后台，20 秒后检查） ---"
          env -u DYLD_INSERT_LIBRARIES "$JAVA_BIN" -jar app/Aria2-PanFlow.jar --server.port=18080 > /tmp/java.log 2>&1 &
          JAVA_PID=$!
          sleep 20
          echo "--- Java 进程状态 ---"
          ps -p $JAVA_PID > /dev/null 2>&1 && echo "Java 进程存活 (PID $JAVA_PID)" || echo "Java 进程已退出"
          echo "--- Java 启动日志（前 25 行） ---"
          head -25 /tmp/java.log
          echo "--- 关键验证：18080 是否监听 ---"
          if nc -z 127.0.0.1 18080 2>/dev/null; then
            echo "[OK] 后端 18080 监听中"
            curl -s -o /dev/null -w "首页 HTTP: %{http_code}\n" -m 5 http://127.0.0.1:18080/
            curl -s -m 5 http://127.0.0.1:18080/api/lifecycle/status
            echo ""
            echo "=== 判定：Java 后端正常 ==="
          else
            echo "[结果] 后端 18080 未监听"
            echo "--- 若 Java 报错，看上面日志 ---"
          fi
          kill $JAVA_PID 2>/dev/null || true
          pkill -f "Aria2-PanFlow.jar" 2>/dev/null || true

      - name: 4. 完整 start.command 测试（替换后）
        run: |
          echo "=== 用 brew 版 aria2c 替换内置二进制 ==="
          BREW_ARIA2=$(which aria2c)
          INNER_ARIA2=$(ls aria2/*/aria2c | head -1)
          cp "$BREW_ARIA2" "$INNER_ARIA2"
          chmod +x "$INNER_ARIA2"
          echo "已替换: $INNER_ARIA2"
          echo "=== 启动 start.command（后台，清代理） ==="
          env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u http_proxy -u https_proxy -u all_proxy -u DYLD_INSERT_LIBRARIES nohup bash start.command > /tmp/start.log 2>&1 &
          sleep 10
          echo "=== 10 秒后日志 ==="
          cat /tmp/start.log
          echo "=== 检查 18080 与 16800 ==="
          nc -z 127.0.0.1 18080 2>/dev/null && echo "[OK] 18080 监听" || echo "[!] 18080 未监听"
          nc -z 127.0.0.1 16800 2>/dev/null && echo "[OK] 16800 监听（aria2 正常！）" || echo "[!] 16800 未监听"
          echo "=== 后端 API ==="
          curl -s -m 5 http://127.0.0.1:18080/api/lifecycle/status || echo "API 无响应"

      - name: 5. 清理
        if: always()
        run: |
          bash stop.command || true
          pkill -f "Aria2-PanFlow.jar" 2>/dev/null || true
          pkill aria2c 2>/dev/null || true
          echo "[OK] 清理完成"
