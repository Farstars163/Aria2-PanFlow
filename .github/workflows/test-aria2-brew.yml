name: aria2 brew 版替换验证

# 目的：验证内置 aria2c 崩溃是否因二进制版本问题——
#   用 Homebrew 版 aria2c 替换内置二进制后重测，若 16800 监听则内置二进制有问题，需替换分发版
on:
  workflow_dispatch:

jobs:
  brew-test:
    name: brew aria2 替换测试 ${{ matrix.project }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Aria2-PanFlow-MacArm-Full
            runs_on: macos-14
            arch: arm64
          - project: Aria2-PanFlow-MacX64-Full
            runs_on: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runs_on }}
    defaults:
      run:
        working-directory: dist-versions-copy/${{ matrix.project }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 1. 安装 Homebrew 版 aria2
        run: |
          echo "=== 安装前：brew 路径 ==="
          which brew || echo "brew 不存在"
          echo "=== 安装 aria2（可能需 1-3 分钟） ==="
          brew install aria2 2>&1 | tail -5
          echo "=== 安装后 aria2c 路径 ==="
          which aria2c
          echo "=== brew 版 aria2c 版本 ==="
          aria2c --version 2>&1 | head -3
          echo "brew aria2c 退出码: ${PIPESTATUS[0]}"

      - name: 2. 用 brew 版替换内置 aria2c
        run: |
          BREW_ARIA2=$(which aria2c)
          echo "brew aria2c: $BREW_ARIA2"
          INNER_ARIA2=$(ls aria2/*/aria2c | head -1)
          echo "内置 aria2c: $INNER_ARIA2"
          echo "=== 替换 ==="
          cp "$BREW_ARIA2" "$INNER_ARIA2"
          chmod +x "$INNER_ARIA2"
          echo "=== 替换后内置路径验证 ==="
          file "$INNER_ARIA2"
          "$INNER_ARIA2" --version 2>&1 | head -3
          echo "替换后退出码: ${PIPESTATUS[0]}"

      - name: 3. 启动测试（brew 版 aria2c）
        run: |
          echo "=== 启动 start.command（后台，清代理变量） ==="
          env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u http_proxy -u https_proxy -u all_proxy -u DYLD_INSERT_LIBRARIES nohup bash start.command > /tmp/start.log 2>&1 &
          sleep 8
          echo "=== 8 秒后启动日志 ==="
          cat /tmp/start.log

          echo "=== 等待后端端口 18080 就绪 ==="
          READY=0
          for i in $(seq 1 90); do
            if nc -z 127.0.0.1 18080 2>/dev/null; then
              echo "[OK] 后端端口 18080 已就绪（${i} 秒）"
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            echo "[失败] 18080 端口未就绪"
            cat /tmp/start.log
            exit 1
          fi

          # 关键验证：aria2 RPC 16800 是否监听（brew 版不崩则应监听）
          echo "=== 关键验证：aria2 RPC 16800 ==="
          if nc -z 127.0.0.1 16800 2>/dev/null; then
            echo "[OK] brew 版 aria2c RPC 16800 监听中"
            curl -s -m 5 -X POST http://127.0.0.1:16800/jsonrpc \
              -H 'Content-Type: application/json' \
              -d '{"jsonrpc":"2.0","id":"1","method":"aria2.getVersion","params":["token:123456"]}' \
              | head -c 300
            echo ""
            echo "=== 判定：内置 aria2c 有版本问题，brew 版可替代 ==="
          else
            echo "[结果] brew 版 aria2c 也未监听 16800（runner 环境特定问题）"
          fi

          echo "=== 后端验证 ==="
          curl -s -o /dev/null -w "首页 HTTP: %{http_code}\n" -m 5 http://127.0.0.1:18080/
          curl -s -m 5 http://127.0.0.1:18080/api/lifecycle/status

      - name: 4. 清理
        if: always()
        run: |
          bash stop.command || true
          pkill -f "Aria2-PanFlow.jar" 2>/dev/null || true
          pkill aria2c 2>/dev/null || true
          echo "[OK] 清理完成"
